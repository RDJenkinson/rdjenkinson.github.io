<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Quantum orbital representation -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.3"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.4"/>
  <!-- Central nucleus -->
  <circle cx="50" cy="50" r="6" fill="url(#grad)"/>
  <!-- Electron representation -->
  <circle cx="50" cy="20" r="4" fill="#6366f1" opacity="0.8"/>
  <circle cx="75" cy="50" r="4" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="50" cy="80" r="4" fill="#6366f1" opacity="0.8"/>
</svg>
