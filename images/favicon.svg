<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Orbital 1: horizontal tilt -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="url(#grad)" stroke-width="3.5" transform="rotate(-30 50 50)" opacity="0.75"/>
  <!-- Orbital 2: angled -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="url(#grad2)" stroke-width="3.5" transform="rotate(30 50 50)" opacity="0.75"/>
  <!-- Orbital 3: steep -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="url(#grad)" stroke-width="3.5" transform="rotate(90 50 50)" opacity="0.75"/>
  <!-- Central nucleus with glow -->
  <circle cx="50" cy="50" r="8" fill="url(#grad2)" opacity="0.25"/>
  <circle cx="50" cy="50" r="5.5" fill="url(#grad)"/>
</svg>
